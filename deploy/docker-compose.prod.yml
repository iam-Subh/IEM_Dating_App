# The whole backend on one small server (AWS t4g.small: 2 ARM CPUs, 2 GB, plus
# 4 GB swap). Run from the repository root:
#   docker compose -f deploy/docker-compose.prod.yml --profile duckdns up -d --build
# Only the API is reachable from the internet (through Caddy or the Cloudflare
# tunnel, below); the database, Redis and the face service only inside this network.
# RabbitMQ is left out: the API does not use it.
name: iem

# Every service's logs are capped (3 files of 10 MB): left alone, Docker's logs
# grow until the disk is full and the database stops.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: iem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: iem
    # Sized for 2 GB shared with everything else.
    command: >
      postgres -c shared_buffers=128MB -c effective_cache_size=384MB
      -c work_mem=4MB -c maintenance_work_mem=64MB -c max_connections=40
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iem -d iem"]
      interval: 10s
      retries: 10
    logging: *logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Locks and limits live here, so nothing is evicted while there is room;
    # only keys with an expiry may go if it ever fills.
    command: redis-server --appendonly yes --maxmemory 96mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      retries: 5
    logging: *logging
    restart: unless-stopped

  face:
    build: ../apps/face-service
    image: iem-face-service
    environment:
      # One worker process: each one loads the face models again.
      FACE_PROCESSES: "1"
    # Loading the models takes a while; after that /health answers at once.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging: *logging
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: iem-api
    env_file: api.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://iem:${POSTGRES_PASSWORD}@postgres:5432/iem?schema=public
      REDIS_URL: redis://redis:6379
      FACE_SERVICE_URL: http://face:8090
      # One proxy in front: Caddy or the Cloudflare tunnel.
      TRUST_PROXY_HOPS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      face:
        condition: service_started
    # Migrations run first on every start, so it is given time before it counts as down.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    logging: *logging
    restart: unless-stopped

  # Docker restarts a container that exits, not one that hangs: this restarts
  # any service whose health check keeps failing (an API that stopped answering).
  autoheal:
    image: willfarrell/autoheal:1.2.0
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: "30"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging: *logging
    restart: unless-stopped

  # The API's https address - one of the two, chosen with a profile:
  #   --profile duckdns : free. A DuckDNS name and Caddy, which gets and renews
  #                       the https certificate itself. Opens ports 80 and 443.
  #   --profile tunnel  : a Cloudflare Tunnel; needs a domain on Cloudflare,
  #                       and no port is opened on the server at all.
  caddy:
    profiles: ["duckdns"]
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      api:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
