plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.chatmedia'
version = '1.0.0'
android {
  namespace 'expo.modules.chatmedia'
  defaultConfig { versionCode 1; versionName '1.0.0' }
}
dependencies {
  // Must equal expo-video's androidxMedia3Version. Media3 artifacts of mixed
  // versions compile but fail at runtime with missing-method errors.
  def media3Version = "1.9.0"
  implementation "androidx.media3:media3-common:${media3Version}"
  implementation "androidx.media3:media3-effect:${media3Version}"
  implementation "androidx.media3:media3-transformer:${media3Version}"
  implementation "androidx.work:work-runtime:2.10.0"
  // Story tools: subject cutouts (model from Google Play services), and the
  // bundled selfie segmentation and face detection models for photo effects.
  implementation "com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1"
  implementation "com.google.mlkit:segmentation-selfie:16.0.0-beta6"
  implementation "com.google.mlkit:face-detection:16.1.7"
}
